    <script>
        /**
         * Multi-Pallet 3D Engine with 4-Column Grid Stacking Logic
         */
        class MultiPalletApp {
            constructor() {
                this.pallets = [];
                this.selectedPalletId = null;

                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;

                this.palletMeshes = [];
                this.boxMeshes = [];
                this.badgeGroup = null;

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.showPalletTitles = true;
                this.currentStep = 0;

                this.init3D();
                this.initEvents();
                this.createInitialPallets();
            }

            init3D() {
                const container = document.getElementById('canvas-container');

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x020617);

                this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 30000);
                this.camera.position.set(2200, 2200, 2800);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(2000, 4000, 2000);
                dirLight.castShadow = true;
                this.scene.add(dirLight);

                this.badgeGroup = new THREE.Group();
                this.scene.add(this.badgeGroup);

                const gridHelper = new THREE.GridHelper(10000, 40, 0x334155, 0x1e293b);
                gridHelper.position.y = -10;
                this.scene.add(gridHelper);

                const animate = () => {
                    requestAnimationFrame(animate);
                    this.controls.update();
                    this.renderer.render(this.scene, this.camera);
                };
                animate();

                window.addEventListener('resize', () => {
                    this.camera.aspect = container.clientWidth / container.clientHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(container.clientWidth, container.clientHeight);
                });
            }

            initEvents() {
                const container = document.getElementById('canvas-container');

                container.addEventListener('pointermove', (e) => {
                    const rect = container.getBoundingClientRect();
                    this.mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                    this.mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
                    this.handleHover(e.clientX, e.clientY);
                });

                container.addEventListener('click', () => {
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    
                    const palletHits = this.raycaster.intersectObjects(this.palletMeshes, true);
                    if (palletHits.length > 0) {
                        let obj = palletHits[0].object;
                        while (obj.parent && !obj.userData.palletId) obj = obj.parent;
                        if (obj.userData.palletId) {
                            this.selectAndInspectPallet(obj.userData.palletId);
                            return;
                        }
                    }

                    const boxHits = this.raycaster.intersectObjects(this.boxMeshes);
                    if (boxHits.length > 0) {
                        const boxData = boxHits[0].object.userData;
                        if (boxData && boxData.palletId) {
                            this.selectAndInspectPallet(boxData.palletId);
                        }
                    }
                });
            }

            createInitialPallets() {
                this.pallets = [
                    {
                        id: 'pallet-1',
                        name: 'พาเลท 1 - แผนกการเงิน',
                        length: 1200,
                        width: 1000,
                        height: 1600,
                        posX: -700,
                        posZ: 0,
                        boxes: [
                            { id: 'b1', name: 'ลังแฟ้มบัญชี A', l: 400, w: 300, h: 250, weight: 10, qty: 16, color: '#0284c7' },
                            { id: 'b2', name: 'แฟ้มภาษี B', l: 400, w: 300, h: 250, weight: 10, qty: 8, color: '#38bdf8' }
                        ]
                    },
                    {
                        id: 'pallet-2',
                        name: 'พาเลท 2 - แฟ้ม HR',
                        length: 1200,
                        width: 1000,
                        height: 1600,
                        posX: 700,
                        posZ: 0,
                        boxes: [
                            { id: 'b3', name: 'ประวัติพนักงาน', l: 400, w: 300, h: 250, weight: 12, qty: 12, color: '#10b981' }
                        ]
                    }
                ];

                this.recalculateAll();
                this.viewAllOverview();
            }

            addNewPallet() {
                const count = this.pallets.length + 1;
                const newPallet = {
                    id: 'pallet-' + Date.now(),
                    name: `พาเลท ${count}`,
                    length: 1200,
                    width: 1000,
                    height: 1600,
                    posX: (count - 1) * 1400 - 700,
                    posZ: 0,
                    boxes: [
                        { id: 'nb1', name: 'ลังแฟ้มเอกสาร', l: 400, w: 300, h: 250, weight: 10, qty: 12, color: '#f59e0b' }
                    ]
                };

                this.pallets.push(newPallet);
                this.recalculateAll();
                this.selectAndInspectPallet(newPallet.id);
            }

            deletePallet(palletId) {
                if (this.pallets.length <= 1) {
                    alert('ต้องมีอย่างน้อย 1 พาเลท');
                    return;
                }
                this.pallets = this.pallets.filter(p => p.id !== palletId);
                if (this.selectedPalletId === palletId) {
                    this.viewAllOverview();
                } else {
                    this.recalculateAll();
                }
            }

            autoArrangePallets() {
                const cols = Math.ceil(Math.sqrt(this.pallets.length));
                const spacingX = 1500;
                const spacingZ = 1400;

                this.pallets.forEach((p, idx) => {
                    const row = Math.floor(idx / cols);
                    const col = idx % cols;
                    p.posX = (col - (cols - 1) / 2) * spacingX;
                    p.posZ = (row - (Math.ceil(this.pallets.length / cols) - 1) / 2) * spacingZ;
                });

                this.recalculateAll();
                this.viewAllOverview();
            }

            selectAndInspectPallet(palletId) {
                this.selectedPalletId = palletId;
                const pallet = this.pallets.find(p => p.id === palletId);
                if (!pallet) return;

                document.getElementById('btn-back-overview').classList.remove('hidden');
                document.getElementById('step-controller-bar').classList.remove('hidden');
                document.getElementById('view-mode-indicator').innerHTML = `
                    <i class="fa-solid fa-crosshairs text-sky-400"></i> ส่อง: <span class="text-white font-bold ml-1">${pallet.name}</span>
                `;

                this.switchTab('inspector');
                this.updateInspectorUI(pallet);
                this.focusCameraOnPallet(pallet);
            }

            viewAllOverview() {
                this.selectedPalletId = null;
                document.getElementById('btn-back-overview').classList.add('hidden');
                document.getElementById('step-controller-bar').classList.add('hidden');
                document.getElementById('view-mode-indicator').innerHTML = `
                    <i class="fa-solid fa-eye text-sky-400"></i> ภาพรวมทุกพาเลท
                `;

                this.switchTab('pallets');
                this.camera.position.set(0, 2800, 3800);
                this.controls.target.set(0, 0, 0);
                this.controls.update();

                this.boxMeshes.forEach(m => m.visible = true);
            }

            focusCameraOnPallet(pallet) {
                const targetX = pallet.posX;
                const targetZ = pallet.posZ;
                
                this.controls.target.set(targetX, pallet.height / 2, targetZ);
                this.camera.position.set(targetX + pallet.length * 1.3, pallet.height * 1.4 + 200, targetZ + pallet.width * 1.6);
                this.controls.update();
            }

            updateInspectorUI(pallet) {
                document.getElementById('insp-pallet-title').textContent = pallet.name;
                
                let totalBoxQty = 0;
                pallet.boxes.forEach(b => totalBoxQty += b.qty);
                document.getElementById('insp-pallet-status').textContent = `${totalBoxQty} กล่อง`;

                document.getElementById('active-pallet-l').value = pallet.length;
                document.getElementById('active-pallet-w').value = pallet.width;
                document.getElementById('active-pallet-h').value = pallet.height;

                const container = document.getElementById('active-pallet-box-list');
                
                if (pallet.boxes.length === 0) {
                    container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">ยังไม่มีกล่องในพาเลทนี้</div>`;
                    return;
                }

                container.innerHTML = pallet.boxes.map((b) => `
                    <div class="bg-slate-900 border border-slate-800 rounded-lg p-2 space-y-1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${b.color}"></span>
                                <input type="text" value="${b.name}" onchange="app.editBoxName('${pallet.id}', '${b.id}', this.value)" class="bg-transparent border-b border-slate-700 text-xs font-bold text-slate-200 focus:border-sky-500 outline-none">
                            </div>
                            <button onclick="app.removeBoxFromPallet('${pallet.id}', '${b.id}')" class="text-slate-500 hover:text-rose-400 text-xs p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-3 gap-1 text-[10px] font-mono text-slate-400 bg-slate-950/60 p-1 rounded">
                            <div>ขนาด: <span class="text-slate-200">${b.l}x${b.w}x${b.h}</span></div>
                            <div>หนัก: <span class="text-emerald-400">${b.weight}kg</span></div>
                            <div>จำนวน: <span class="text-sky-400 font-bold">${b.qty} ใบ</span></div>
                        </div>
                    </div>
                `).join('');
            }

            updateActivePalletSpec() {
                if (!this.selectedPalletId) return;
                const pallet = this.pallets.find(p => p.id === this.selectedPalletId);
                if (!pallet) return;

                pallet.length = parseInt(document.getElementById('active-pallet-l').value) || 1200;
                pallet.width = parseInt(document.getElementById('active-pallet-w').value) || 1000;
                pallet.height = parseInt(document.getElementById('active-pallet-h').value) || 1600;

                this.recalculateAll();
            }

            addBoxToActivePallet() {
                if (!this.selectedPalletId) return;
                const pallet = this.pallets.find(p => p.id === this.selectedPalletId);
                if (!pallet) return;

                const name = document.getElementById('new-box-name').value.trim() || 'ลังแฟ้มเอกสาร';
                const l = parseInt(document.getElementById('new-box-l').value) || 400;
                const w = parseInt(document.getElementById('new-box-w').value) || 300;
                const h = parseInt(document.getElementById('new-box-h').value) || 250;
                const weight = parseFloat(document.getElementById('new-box-weight').value) || 10;
                const qty = parseInt(document.getElementById('new-box-qty').value) || 8;
                const color = document.getElementById('new-box-color').value;

                pallet.boxes.push({
                    id: 'b-' + Date.now(),
                    name, l, w, h, weight, qty, color
                });

                this.recalculateAll();
                this.updateInspectorUI(pallet);
            }

            editBoxName(palletId, boxId, newName) {
                const pallet = this.pallets.find(p => p.id === palletId);
                if (!pallet) return;
                const box = pallet.boxes.find(b => b.id === boxId);
                if (box) box.name = newName;
                this.recalculateAll();
            }

            removeBoxFromPallet(palletId, boxId) {
                const pallet = this.pallets.find(p => p.id === palletId);
                if (!pallet) return;
                pallet.boxes = pallet.boxes.filter(b => b.id !== boxId);
                this.recalculateAll();
                this.updateInspectorUI(pallet);
            }

            /**
             * Core 4-Column Stacking Algorithm Logic
             */
            recalculateAll() {
                this.boxMeshes.forEach(m => this.scene.remove(m));
                this.palletMeshes.forEach(m => this.scene.remove(m));
                this.boxMeshes = [];
                this.palletMeshes = [];

                while (this.badgeGroup.children.length > 0) {
                    this.badgeGroup.remove(this.badgeGroup.children[0]);
                }

                const is4ColumnMode = document.getElementById('opt-4-column-mode').checked;

                let grandTotalBoxes = 0;

                this.pallets.forEach(pallet => {
                    const palletGroup = this.createPalletBase3D(pallet);
                    this.scene.add(palletGroup);

                    let itemsToPack = [];
                    let boxCounter = 1;

                    pallet.boxes.forEach(b => {
                        for (let i = 0; i < b.qty; i++) {
                            itemsToPack.push({
                                uid: `${b.name.slice(0, 3).toUpperCase()}-${String(boxCounter++).padStart(2, '0')}`,
                                palletId: pallet.id,
                                name: b.name,
                                l: b.l, w: b.w, h: b.h,
                                weight: b.weight, color: b.color
                            });
                        }
                    });

                    let packedBoxes = [];

                    if (is4ColumnMode) {
                        // --- 4-COLUMN GRID STACKING ALGORITHM ---
                        // Define 4 Slots on the Pallet Base (2x2 Grid)
                        const gridCols = 2;
                        const gridRows = 2;
                        const colWidth = pallet.length / gridCols;
                        const rowDepth = pallet.width / gridRows;

                        // Track height accumulated in each of the 4 columns [slot0, slot1, slot2, slot3]
                        let slotHeights = [0, 0, 0, 0];
                        let slotLayers = [1, 1, 1, 1];

                        itemsToPack.forEach((item, idx) => {
                            // Target slot cycling 0 -> 1 -> 2 -> 3
                            const slotIdx = idx % 4;
                            const currentHeight = slotHeights[slotIdx];

                            if (currentHeight + item.h <= pallet.height) {
                                const col = slotIdx % gridCols;
                                const row = Math.floor(slotIdx / gridCols);

                                const x = col * colWidth + (colWidth - item.l) / 2;
                                const z = row * rowDepth + (rowDepth - item.w) / 2;

                                packedBoxes.push({
                                    ...item,
                                    placedL: item.l,
                                    placedW: item.w,
                                    x: Math.max(0, x),
                                    y: currentHeight,
                                    z: Math.max(0, z),
                                    layer: slotLayers[slotIdx],
                                    columnNum: slotIdx + 1
                                });

                                slotHeights[slotIdx] += item.h;
                                slotLayers[slotIdx]++;
                            }
                        });
                    } else {
                        // Standard Packing Logic
                        let currentY = 0;
                        let layerIdx = 1;
                        while (itemsToPack.length > 0 && currentY < pallet.height) {
                            let layerH = 0;
                            let currentX = 0, currentZ = 0, maxZ = 0;

                            for (let i = 0; i < itemsToPack.length; i++) {
                                let item = itemsToPack[i];
                                if (currentX + item.l <= pallet.length && currentZ + item.w <= pallet.width) {
                                    packedBoxes.push({
                                        ...item, placedL: item.l, placedW: item.w,
                                        x: currentX, y: currentY, z: currentZ, layer: layerIdx
                                    });
                                    layerH = Math.max(layerH, item.h);
                                    currentX += item.l;
                                    maxZ = Math.max(maxZ, item.w);
                                    itemsToPack.splice(i, 1);
                                    i--;
                                } else {
                                    currentX = 0;
                                    currentZ += maxZ;
                                    maxZ = 0;
                                }
                            }
                            if (layerH === 0) break;
                            currentY += layerH;
                            layerIdx++;
                        }
                    }

                    pallet.packedBoxes = packedBoxes;
                    grandTotalBoxes += packedBoxes.length;

                    // Render 3D Boxes
                    packedBoxes.forEach((box, stepIdx) => {
                        const boxGeo = new THREE.BoxGeometry(box.placedL, box.h, box.placedW);
                        const boxMat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(box.color),
                            roughness: 0.3
                        });
                        const mesh = new THREE.Mesh(boxGeo, boxMat);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;

                        const posX = pallet.posX + box.x + box.placedL/2 - pallet.length/2;
                        const posY = box.y + box.h/2;
                        const posZ = pallet.posZ + box.z + box.placedW/2 - pallet.width/2;

                        mesh.position.set(posX, posY, posZ);
                        mesh.userData = { ...box, stepIndex: stepIdx + 1 };

                        const edgeGeo = new THREE.EdgesGeometry(boxGeo);
                        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });
                        mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

                        this.scene.add(mesh);
                        this.boxMeshes.push(mesh);
                    });

                    if (this.showPalletTitles) {
                        const titleBadge = this.createBadgeSprite(pallet.name);
                        titleBadge.position.set(pallet.posX, pallet.height + 200, pallet.posZ);
                        this.badgeGroup.add(titleBadge);
                    }
                });

                document.getElementById('stat-total-pallets').textContent = this.pallets.length;
                document.getElementById('stat-total-boxes').textContent = grandTotalBoxes;
                document.getElementById('pallet-count-badge').textContent = this.pallets.length;

                this.renderPalletListUI();

                if (this.selectedPalletId) {
                    const activePallet = this.pallets.find(p => p.id === this.selectedPalletId);
                    if (activePallet && activePallet.packedBoxes) {
                        document.getElementById('step-slider').max = activePallet.packedBoxes.length;
                        this.setStep(activePallet.packedBoxes.length);
                    }
                }
            }

            createPalletBase3D(pallet) {
                const group = new THREE.Group();
                group.userData = { palletId: pallet.id };

                const woodMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.8 });
                const slatCount = 7;
                const slatWidth = pallet.length / slatCount - 8;

                for (let i = 0; i < slatCount; i++) {
                    const slatGeo = new THREE.BoxGeometry(slatWidth, 20, pallet.width);
                    const slat = new THREE.Mesh(slatGeo, woodMat);
                    slat.position.set(-pallet.length/2 + slatWidth/2 + i * (slatWidth + 8), -10, 0);
                    slat.receiveShadow = true;
                    slat.userData = { palletId: pallet.id };
                    group.add(slat);
                }

                group.position.set(pallet.posX, 0, pallet.posZ);
                this.palletMeshes.push(group);
                return group;
            }

            createBadgeSprite(text) {
                const canvas = document.createElement('canvas');
                canvas.width = 384;
                canvas.height = 70;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = 'rgba(2, 132, 199, 0.9)';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(6, 6, 372, 58, 14);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Kanit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 192, 35);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(280, 51, 1);
                return sprite;
            }

            renderPalletListUI() {
                const container = document.getElementById('pallet-list-container');
                container.innerHTML = this.pallets.map(p => `
                    <div class="bg-slate-900 border ${this.selectedPalletId === p.id ? 'border-sky-500 ring-1 ring-sky-500' : 'border-slate-800'} rounded-xl p-2.5 space-y-2">
                        <div class="flex items-center justify-between">
                            <input type="text" value="${p.name}" onchange="app.renamePallet('${p.id}', this.value)" class="bg-transparent border-b border-slate-700 text-xs font-bold text-white focus:border-sky-500 outline-none">
                            <div class="flex items-center gap-1">
                                <button onclick="app.selectAndInspectPallet('${p.id}')" class="text-[11px] bg-sky-600 hover:bg-sky-500 text-white px-2 py-1 rounded flex items-center gap-1">
                                    <i class="fa-solid fa-magnifying-glass"></i> จัดการ
                                </button>
                                <button onclick="app.deletePallet('${p.id}')" class="text-slate-500 hover:text-rose-400 p-1 text-xs">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-[10px] font-mono text-slate-400 bg-slate-950/70 p-1.5 rounded">
                            <div>จัดวางได้: <span class="text-sky-400 font-bold">${p.packedBoxes ? p.packedBoxes.length : 0} ใบ</span></div>
                            <div>ความสูง: <span class="text-slate-300">${p.height} mm</span></div>
                        </div>
                    </div>
                `).join('');
            }

            renamePallet(palletId, newName) {
                const p = this.pallets.find(item => item.id === palletId);
                if (p) p.name = newName;
                this.recalculateAll();
            }

            setStep(step) {
                if (!this.selectedPalletId) return;
                this.currentStep = step;
                document.getElementById('step-slider').value = step;
                
                const activePallet = this.pallets.find(p => p.id === this.selectedPalletId);
                if (!activePallet || !activePallet.packedBoxes) return;

                document.getElementById('step-counter').textContent = `Step ${step} / ${activePallet.packedBoxes.length}`;

                this.boxMeshes.forEach(mesh => {
                    if (mesh.userData.palletId === this.selectedPalletId) {
                        mesh.visible = mesh.userData.stepIndex <= step;
                    }
                });
            }

            nextStep() { this.setStep(this.currentStep + 1); }
            prevStep() { if (this.currentStep > 0) this.setStep(this.currentStep - 1); }

            handleHover(clientX, clientY) {
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.boxMeshes);
                const tooltip = document.getElementById('inspector-tooltip');

                if (intersects.length > 0) {
                    const data = intersects[0].object.userData;
                    const pallet = this.pallets.find(p => p.id === data.palletId);

                    tooltip.classList.remove('hidden');
                    tooltip.style.left = `${Math.min(clientX + 10, window.innerWidth - 190)}px`;
                    tooltip.style.top = `${clientY + 10}px`;

                    document.getElementById('tooltip-color-badge').style.backgroundColor = data.color;
                    document.getElementById('tooltip-title').textContent = data.name;
                    document.getElementById('tooltip-details').innerHTML = `
                        <div>รหัส: <span class="text-sky-400">${data.uid}</span></div>
                        <div>พาเลท: <span class="text-amber-400">${pallet ? pallet.name : '-'}</span></div>
                        <div>แถว/ชั้น: <span class="text-emerald-400">แถว ${data.columnNum || 1} (ชั้น ${data.layer})</span></div>
                        <div>ขนาด: ${data.l}x${data.w}x${data.h} mm</div>
                    `;
                } else {
                    tooltip.classList.add('hidden');
                }
            }

            switchTab(tabName) {
                ['pallets', 'inspector', 'settings'].forEach(t => {
                    document.getElementById(`tab-${t}`).classList.add('hidden');
                    const btn = document.getElementById(`tab-btn-${t}`);
                    btn.classList.remove('text-sky-400', 'border-sky-500');
                    btn.classList.add('text-slate-400', 'border-transparent');
                });

                document.getElementById(`tab-${tabName}`).classList.remove('hidden');
                const activeBtn = document.getElementById(`tab-btn-${tabName}`);
                activeBtn.classList.add('text-sky-400', 'border-sky-500');
                activeBtn.classList.remove('text-slate-400', 'border-transparent');
            }

            togglePalletTitles(visible) {
                this.showPalletTitles = visible;
                this.badgeGroup.visible = visible;
            }

            toggleMobilePanel() {
                const sidebar = document.getElementById('left-sidebar');
                sidebar.classList.toggle('-translate-x-full');
            }

            exportManifest() {
                const modal = document.getElementById('manifest-modal');
                const content = document.getElementById('manifest-content');

                content.innerHTML = `
                    <div class="border-b border-slate-800 pb-2">
                        <h3 class="text-xs font-bold text-white">รายงานสรุปการวางลัง 4 แถวซ้อนชั้น</h3>
                        <p class="text-slate-400 text-[10px]">ระบบ Pallet3D Studio</p>
                    </div>

                    ${this.pallets.map((p, idx) => `
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-1">
                                <h4 class="font-bold text-sky-400 text-xs">${idx + 1}.${p.name}</h4>
                                <span class="font-mono text-[10px] text-slate-400">${p.packedBoxes ? p.packedBoxes.length : 0} กล่อง</span>
                            </div>
                            <table class="w-full text-left font-mono text-[10px]">
                                <thead>
                                    <tr class="text-slate-500 border-b border-slate-800">
                                        <th class="py-1">รหัส</th>
                                        <th class="py-1">ชื่อลัง</th>
                                        <th class="py-1">ตำแหน่งแถว/ชั้น</th>
                                        <th class="py-1">น้ำหนัก</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(p.packedBoxes || []).map(b => `
                                        <tr class="border-b border-slate-900">
                                            <td class="py-1 text-sky-300 font-bold">${b.uid}</td>
                                            <td class="py-1 text-slate-200">${b.name}</td>
                                            <td class="py-1 text-amber-400">แถว ${b.columnNum || 1} (ชั้น ${b.layer})</td>
                                            <td class="py-1 text-emerald-400">${b.weight} kg</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `).join('')}
                `;

                modal.classList.remove('hidden');
            }

            closeManifestModal() {
                document.getElementById('manifest-modal').classList.add('hidden');
            }
        }

        let app = null;
        window.addEventListener('load', () => {
            app = new MultiPalletApp();
        });
    </script>
</body>
</html>
