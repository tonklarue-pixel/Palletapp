<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Pallet Studio Full System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #020617; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #canvas-container canvas { display: block; outline: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        button, input, select { touch-action: manipulation; }
    </style>
</head>
<body class="flex flex-col font-sans bg-slate-950 text-slate-100">

    <!-- Top Compact Header -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="bg-sky-600 p-1.5 rounded-lg text-white shadow-md shadow-sky-600/30">
                <i class="fa-solid fa-boxes-packing text-sm"></i>
            </div>
            <h1 class="font-bold text-sm text-white flex items-center gap-1">
                Pallet3D <span class="text-[9px] bg-sky-500/20 text-sky-400 border border-sky-500/30 px-1.5 py-0.2 rounded-full font-mono">FULL SYSTEM</span>
            </h1>
        </div>

        <div class="flex items-center space-x-1.5">
            <button id="btn-back-overview" onclick="app.viewAllOverview()" class="hidden bg-slate-800 text-sky-400 border border-sky-500/40 px-2 py-1 rounded-lg text-xs font-medium flex items-center gap-1 active:scale-95 transition-all">
                <i class="fa-solid fa-globe"></i> ภาพรวม
            </button>
            <button onclick="app.addNewPallet()" class="bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1 rounded-lg text-xs font-medium flex items-center gap-1 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-plus"></i> เพิ่มพาเลท
            </button>
            <button onclick="app.exportManifest()" class="bg-emerald-600 text-white p-1.5 rounded-lg text-xs active:scale-95 transition-all">
                <i class="fa-solid fa-file-invoice"></i>
            </button>
        </div>
    </header>

    <!-- Main Body Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden" style="height: calc(100vh - 104px);">

        <!-- 3D Viewport -->
        <main id="view-3d" class="w-full h-full relative bg-slate-950">
            <div id="canvas-container"></div>

            <!-- Top Viewport Banner -->
            <div class="absolute top-2 left-2 right-2 pointer-events-none z-10 flex justify-center">
                <div class="bg-slate-900/85 backdrop-blur border border-slate-800 px-3 py-1 rounded-full text-[11px] text-slate-300 pointer-events-auto shadow-lg">
                    <span id="view-mode-indicator" class="font-bold text-sky-400 truncate">
                        <i class="fa-solid fa-eye"></i> ภาพรวมพาเลท (แตะพาเลทเพื่อส่องดู)
                    </span>
                </div>
            </div>

            <!-- Step Animation Overlay -->
            <div id="step-controller-bar" class="hidden absolute bottom-3 left-3 right-3 bg-slate-900/90 backdrop-blur border border-slate-800 p-2 rounded-xl shadow-xl z-10 flex flex-col gap-1">
                <div class="flex items-center justify-between text-[11px] text-slate-300 px-1">
                    <span class="font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-play-circle text-sky-400"></i> ขั้นตอนการวางซ้อน
                    </span>
                    <span id="step-counter" class="font-mono text-sky-400 font-bold">Step 0 / 0</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="app.prevStep()" class="p-1.5 bg-slate-800 rounded text-xs active:bg-slate-700"><i class="fa-solid fa-backward-step"></i></button>
                    <input type="range" id="step-slider" min="0" max="0" value="0" oninput="app.setStep(parseInt(this.value))" class="flex-1 accent-sky-500 bg-slate-800 rounded h-2">
                    <button onclick="app.nextStep()" class="p-1.5 bg-slate-800 rounded text-xs active:bg-slate-700"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </main>

        <!-- Control Sheet Panel -->
        <div id="panel-content" class="hidden w-full h-full bg-slate-900 overflow-y-auto custom-scrollbar p-3 space-y-3">
            
            <!-- Tab 1: Pallets List -->
            <div id="tab-pallets" class="space-y-3">
                <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-300">จัดเรียงตำแหน่งพาเลท:</span>
                    <button onclick="app.autoArrangePallets()" class="text-xs text-sky-400 bg-sky-950 border border-sky-800 px-2.5 py-1 rounded-lg">
                        <i class="fa-solid fa-grid-2"></i> เรียงตาราง
                    </button>
                </div>
                <div id="pallet-list-container" class="space-y-2"></div>
            </div>

            <!-- Tab 2: Box Inspector & CRUD -->
            <div id="tab-inspector" class="hidden space-y-3">
                <div id="inspector-pallet-header" class="p-2.5 bg-sky-950/50 border border-sky-800/60 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-sky-300 truncate" id="insp-pallet-title">พาเลทที่เลือก</span>
                        <span id="insp-pallet-status" class="text-[10px] bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-full font-mono">0 กล่อง</span>
                    </div>
                    <div class="grid grid-cols-3 gap-1.5 text-[11px]">
                        <div>
                            <label class="text-[10px] text-slate-400">ยาว L (mm)</label>
                            <input type="number" id="active-pallet-l" onchange="app.updateActivePalletSpec()" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-sky-400 font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">กว้าง W (mm)</label>
                            <input type="number" id="active-pallet-w" onchange="app.updateActivePalletSpec()" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-sky-400 font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">สูง H (mm)</label>
                            <input type="number" id="active-pallet-h" onchange="app.updateActivePalletSpec()" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-sky-400 font-mono">
                        </div>
                    </div>
                </div>

                <!-- Form Add New Box -->
                <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                    <div class="text-xs font-bold text-slate-200">
                        <i class="fa-solid fa-plus-circle text-sky-400"></i> เพิ่มลังแฟ้มลงพาเลทนี้
                    </div>
                    <input type="text" id="new-box-name" placeholder="ชื่อลัง เช่น เอกสารการเงิน A1" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white outline-none focus:ring-1 focus:ring-sky-500">
                    
                    <div class="grid grid-cols-3 gap-1.5">
                        <div>
                            <label class="text-[10px] text-slate-400">ยาว L</label>
                            <input type="number" id="new-box-l" value="400" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-xs font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">กว้าง W</label>
                            <input type="number" id="new-box-w" value="300" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-xs font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">สูง H</label>
                            <input type="number" id="new-box-h" value="250" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-xs font-mono">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5 items-center">
                        <div>
                            <label class="text-[10px] text-slate-400">หนัก (kg)</label>
                            <input type="number" id="new-box-weight" value="10" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-xs font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">จำนวน (ใบ)</label>
                            <input type="number" id="new-box-qty" value="8" class="w-full bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-xs font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">สีกล่อง</label>
                            <input type="color" id="new-box-color" value="#0284c7" class="w-full h-7 bg-slate-800 border border-slate-700 rounded cursor-pointer p-0.5">
                        </div>
                    </div>

                    <button onclick="app.addBoxToActivePallet()" class="w-full bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-lg text-xs font-bold transition-all active:scale-95">
                        + เพิ่มลังเข้าพาเลท
                    </button>
                </div>

                <div id="active-pallet-box-list" class="space-y-2"></div>
            </div>

            <!-- Tab 3: Display Settings -->
            <div id="tab-settings" class="hidden space-y-3">
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-3">
                    <h3 class="text-xs font-bold text-sky-400 uppercase">ตั้งค่าการแสดงผล</h3>
                    
                    <label class="flex items-center gap-2 text-xs text-slate-300">
                        <input type="checkbox" id="opt-4-column-mode" checked onchange="app.recalculateAll()" class="w-4 h-4 rounded accent-sky-500">
                        <span>จัดเรียงแบบ 4 แถวซ้อนขึ้นไป</span>
                    </label>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="h-14 bg-slate-900 border-t border-slate-800 grid grid-cols-4 shrink-0 z-30">
        <button onclick="app.switchMobileTab('3d')" id="nav-btn-3d" class="flex flex-col items-center justify-center text-sky-400">
            <i class="fa-solid fa-cube text-base"></i>
            <span class="text-[10px] mt-0.5 font-medium">ฉาก 3D</span>
        </button>
        <button onclick="app.switchMobileTab('pallets')" id="nav-btn-pallets" class="flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-pallet text-base"></i>
            <span class="text-[10px] mt-0.5 font-medium">พาเลท</span>
        </button>
        <button onclick="app.switchMobileTab('inspector')" id="nav-btn-inspector" class="flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-box text-base"></i>
            <span class="text-[10px] mt-0.5 font-medium">ลังแฟ้ม</span>
        </button>
        <button onclick="app.switchMobileTab('settings')" id="nav-btn-settings" class="flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-sliders text-base"></i>
            <span class="text-[10px] mt-0.5 font-medium">ตั้งค่า</span>
        </button>
    </nav>

    <!-- Print Report Modal -->
    <div id="manifest-modal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur z-50 flex items-center justify-center p-3">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h2 class="text-xs font-bold text-white"><i class="fa-solid fa-file-invoice text-emerald-400"></i> รายงานการจัดวางพาเลท</h2>
                <button onclick="app.closeManifestModal()" class="text-slate-400 text-base"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-3 overflow-y-auto space-y-3 text-xs text-slate-300" id="manifest-content"></div>
            <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-end gap-2">
                <button onclick="app.closeManifestModal()" class="px-3 py-1 bg-slate-800 rounded text-xs">ปิด</button>
                <button onclick="window.print()" class="px-3 py-1 bg-emerald-600 text-white rounded text-xs">พิมพ์</button>
            </div>
        </div>
    </div>

    <script>
        class FullSystemPalletApp {
            constructor() {
                this.pallets = [];
                this.selectedPalletId = null;

                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;

                this.palletMeshes = [];
                this.boxMeshes = [];

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.currentStep = 0;
                this.activeTab = '3d';

                this.init3D();
                this.initEvents();
                this.loadLocalData();
            }

            init3D() {
                const container = document.getElementById('canvas-container');
                const width = container.clientWidth || window.innerWidth;
                const height = container.clientHeight || (window.innerHeight - 104);

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x020617);

                this.camera = new THREE.PerspectiveCamera(50, width / height, 1, 30000);
                this.camera.position.set(2200, 2600, 3000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(2000, 4000, 2000);
                dirLight.castShadow = true;
                this.scene.add(dirLight);

                const gridHelper = new THREE.GridHelper(10000, 40, 0x334155, 0x1e293b);
                gridHelper.position.y = -10;
                this.scene.add(gridHelper);

                const animate = () => {
                    requestAnimationFrame(animate);
                    this.controls.update();
                    this.renderer.render(this.scene, this.camera);
                };
                animate();

                window.addEventListener('resize', () => {
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || (window.innerHeight - 104);
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                });
            }

            initEvents() {
                const container = document.getElementById('canvas-container');

                container.addEventListener('click', (e) => {
                    const rect = container.getBoundingClientRect();
                    this.mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                    this.mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    
                    const palletHits = this.raycaster.intersectObjects(this.palletMeshes, true);
                    if (palletHits.length > 0) {
                        let obj = palletHits[0].object;
                        while (obj.parent && !obj.userData.palletId) obj = obj.parent;
                        if (obj.userData.palletId) {
                            this.selectAndInspectPallet(obj.userData.palletId);
                            return;
                        }
                    }

                    const boxHits = this.raycaster.intersectObjects(this.boxMeshes);
                    if (boxHits.length > 0) {
                        const boxData = boxHits[0].object.userData;
                        if (boxData && boxData.palletId) {
                            this.selectAndInspectPallet(boxData.palletId);
                        }
                    }
                });
            }

            loadLocalData() {
                const saved = localStorage.getItem('pallet_full_data_v5');
                if (saved) {
                    try { this.pallets = JSON.parse(saved); } catch(e) {}
                }
                if (!this.pallets || this.pallets.length === 0) {
                    this.pallets = [
                        {
                            id: 'pallet-1',
                            name: 'พาเลท 1 - เอกสารบัญชี',
                            length: 1200, width: 1000, height: 1600,
                            posX: -650, posZ: 0,
                            boxes: [{ id: 'b1', name: 'ลังแฟ้มบัญชี A1', l: 400, w: 300, h: 250, weight: 10, qty: 12, color: '#0284c7' }]
                        },
                        {
                            id: 'pallet-2',
                            name: 'พาเลท 2 - แฟ้ม HR',
                            length: 1200, width: 1000, height: 1600,
                            posX: 650, posZ: 0,
                            boxes: [{ id: 'b2', name: 'แฟ้มประวัติพนักงาน', l: 400, w: 300, h: 250, weight: 12, qty: 8, color: '#10b981' }]
                        }
                    ];
                }
                this.recalculateAll();
                this.viewAllOverview();
            }

            saveLocalData() {
                localStorage.setItem('pallet_full_data_v5', JSON.stringify(this.pallets));
            }

            addNewPallet() {
                const count = this.pallets.length + 1;
                const newPallet = {
                    id: 'pallet-' + Date.now(),
                    name: `พาเลท ${count}`,
                    length: 1200, width: 1000, height: 1600,
                    posX: (count - 1) * 1400 - 650, posZ: 0,
                    boxes: [{ id: 'nb1', name: 'ลังแฟ้มเอกสาร', l: 400, w: 300, h: 250, weight: 10, qty: 8, color: '#f59e0b' }]
                };

                this.pallets.push(newPallet);
                this.recalculateAll();
                this.selectAndInspectPallet(newPallet.id);
            }

            deletePallet(palletId) {
                if (this.pallets.length <= 1) {
                    alert('ต้องมีอย่างน้อย 1 พาเลทในระบบ');
                    return;
                }
                this.pallets = this.pallets.filter(p => p.id !== palletId);
                if (this.selectedPalletId === palletId) {
                    this.viewAllOverview();
                } else {
                    this.recalculateAll();
                }
            }

            autoArrangePallets() {
                const cols = Math.ceil(Math.sqrt(this.pallets.length));
                const spacingX = 1400;
                const spacingZ = 1300;

                this.pallets.forEach((p, idx) => {
                    const row = Math.floor(idx / cols);
                    const col = idx % cols;
                    p.posX = (col - (cols - 1) / 2) * spacingX;
                    p.posZ = (row - (Math.ceil(this.pallets.length / cols) - 1) / 2) * spacingZ;
                });

                this.recalculateAll();
                this.viewAllOverview();
            }

            selectAndInspectPallet(palletId) {
                this.selectedPalletId = palletId;
                const pallet = this.pallets.find(p => p.id === palletId);
                if (!pallet) return;

                document.getElementById('btn-back-overview').classList.remove('hidden');
                document.getElementById('step-controller-bar').classList.remove('hidden');
                document.getElementById('view-mode-indicator').innerHTML = `
                    <i class="fa-solid fa-crosshairs text-sky-400"></i> <span class="text-white font-bold ml-1">${pallet.name}</span>
                `;

                this.updateInspectorUI(pallet);
                this.focusCameraOnPallet(pallet);
                this.switchMobileTab('3d');
            }

            viewAllOverview() {
                this.selectedPalletId = null;
                document.getElementById('btn-back-overview').classList.add('hidden');
                document.getElementById('step-controller-bar').classList.add('hidden');
                document.getElementById('view-mode-indicator').innerHTML = `
                    <i class="fa-solid fa-eye text-sky-400"></i> ภาพรวมพาเลท (แตะพาเลทเพื่อส่องดู)
                `;

                this.camera.position.set(0, 3000, 3600);
                this.controls.target.set(0, 0, 0);
                this.controls.update();

                this.boxMeshes.forEach(m => m.visible = true);
            }

            focusCameraOnPallet(pallet) {
                this.controls.target.set(pallet.posX, pallet.height / 2, pallet.posZ);
                this.camera.position.set(pallet.posX + pallet.length * 1.2, pallet.height * 1.5 + 200, pallet.posZ + pallet.width * 1.5);
                this.controls.update();
            }

            updateInspectorUI(pallet) {
                document.getElementById('insp-pallet-title').textContent = pallet.name;
                
                let totalBoxQty = 0;
                pallet.boxes.forEach(b => totalBoxQty += b.qty);
                document.getElementById('insp-pallet-status').textContent = `${totalBoxQty} กล่อง`;

                document.getElementById('active-pallet-l').value = pallet.length;
                document.getElementById('active-pallet-w').value = pallet.width;
                document.getElementById('active-pallet-h').value = pallet.height;

                const container = document.getElementById('active-pallet-box-list');
                
                if (pallet.boxes.length === 0) {
                    container.innerHTML = `<div class="text-center py-4 text-slate-500 text-xs">ยังไม่มีกล่องในพาเลทนี้</div>`;
                    return;
                }

                container.innerHTML = pallet.boxes.map((b) => `
                    <div class="bg-slate-950 border border-slate-800 rounded-lg p-2 space-y-1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 flex-1">
                                <span class="w-2.5 h-2.5 rounded-full inline-block shrink-0" style="background-color: ${b.color}"></span>
                                <input type="text" value="${b.name}" onchange="app.editBoxName('${pallet.id}', '${b.id}', this.value)" class="w-full bg-transparent border-b border-slate-700 text-xs font-bold text-slate-200 focus:border-sky-500 outline-none">
                            </div>
                            <button onclick="app.removeBoxFromPallet('${pallet.id}', '${b.id}')" class="text-slate-500 hover:text-rose-400 text-xs p-1 ml-2">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-3 gap-1 text-[10px] font-mono text-slate-400 bg-slate-900 p-1 rounded">
                            <div>ขนาด: <span class="text-slate-200">${b.l}x${b.w}x${b.h}</span></div>
                            <div>หนัก: <span class="text-emerald-400">${b.weight}kg</span></div>
                            <div>จำนวน: <span class="text-sky-400 font-bold">${b.qty} ใบ</span></div>
                        </div>
                    </div>
                `).join('');
            }

            updateActivePalletSpec() {
                if (!this.selectedPalletId) return;
                const pallet = this.pallets.find(p => p.id === this.selectedPalletId);
                if (!pallet) return;

                pallet.length = parseInt(document.getElementById('active-pallet-l').value) || 1200;
                pallet.width = parseInt(document.getElementById('active-pallet-w').value) || 1000;
                pallet.height = parseInt(document.getElementById('active-pallet-h').value) || 1600;

                this.recalculateAll();
            }

            addBoxToActivePallet() {
                if (!this.selectedPalletId) return;
                const pallet = this.pallets.find(p => p.id === this.selectedPalletId);
                if (!pallet) return;

                const name = document.getElementById('new-box-name').value.trim() || 'ลังแฟ้มเอกสาร';
                const l = parseInt(document.getElementById('new-box-l').value) || 400;
                const w = parseInt(document.getElementById('new-box-w').value) || 300;
                const h = parseInt(document.getElementById('new-box-h').value) || 250;
                const weight = parseFloat(document.getElementById('new-box-weight').value) || 10;
                const qty = parseInt(document.getElementById('new-box-qty').value) || 8;
                const color = document.getElementById('new-box-color').value;

                pallet.boxes.push({
                    id: 'b-' + Date.now(),
                    name, l, w, h, weight, qty, color
                });

                this.recalculateAll();
                this.updateInspectorUI(pallet);
            }

            editBoxName(palletId, boxId, newName) {
                const pallet = this.pallets.find(p => p.id === palletId);
                if (!pallet) return;
                const box = pallet.boxes.find(b => b.id === boxId);
                if (box) box.name = newName;
                this.recalculateAll();
            }

            removeBoxFromPallet(palletId, boxId) {
                const pallet = this.pallets.find(p => p.id === palletId);
                if (!pallet) return;
                pallet.boxes = pallet.boxes.filter(b => b.id !== boxId);
                this.recalculateAll();
                this.updateInspectorUI(pallet);
            }

            recalculateAll() {
                this.boxMeshes.forEach(m => this.scene.remove(m));
                this.palletMeshes.forEach(m => this.scene.remove(m));
                this.boxMeshes = [];
                this.palletMeshes = [];

                const is4ColumnMode = document.getElementById('opt-4-column-mode').checked;

                this.pallets.forEach(pallet => {
                    const palletGroup = this.createPalletBase3D(pallet);
                    this.scene.add(palletGroup);

                    let itemsToPack = [];
                    let boxCounter = 1;

                    pallet.boxes.forEach(b => {
                        for (let i = 0; i < b.qty; i++) {
                            itemsToPack.push({
                                uid: `${b.name.slice(0, 3).toUpperCase()}-${String(boxCounter++).padStart(2, '0')}`,
                                palletId: pallet.id,
                                name: b.name,
                                l: b.l, w: b.w, h: b.h,
                                weight: b.weight, color: b.color
                            });
                        }
                    });

                    let packedBoxes = [];

                    if (is4ColumnMode) {
                        const gridCols = 2;
                        const gridRows = 2;
                        const colWidth = pallet.length / gridCols;
                        const rowDepth = pallet.width / gridRows;

                        let slotHeights = [0, 0, 0, 0];
                        let slotLayers = [1, 1, 1, 1];

                        itemsToPack.forEach((item, idx) => {
                            const slotIdx = idx % 4;
                            const currentHeight = slotHeights[slotIdx];

                            if (currentHeight + item.h <= pallet.height) {
                                const col = slotIdx % gridCols;
                                const row = Math.floor(slotIdx / gridCols);

                                const x = col * colWidth + (colWidth - item.l) / 2;
                                const z = row * rowDepth + (rowDepth - item.w) / 2;

                                packedBoxes.push({
                                    ...item,
                                    placedL: item.l,
                                    placedW: item.w,
                                    x: Math.max(0, x),
                                    y: currentHeight,
                                    z: Math.max(0, z),
                                    layer: slotLayers[slotIdx],
                                    columnNum: slotIdx + 1
                                });

                                slotHeights[slotIdx] += item.h;
                                slotLayers[slotIdx]++;
                            }
                        });
                    }

                    pallet.packedBoxes = packedBoxes;

                    packedBoxes.forEach((box, stepIdx) => {
                        const boxGeo = new THREE.BoxGeometry(box.placedL, box.h, box.placedW);
                        const boxMat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(box.color),
                            roughness: 0.3
                        });
                        
                        const mesh = new THREE.Mesh(boxGeo, boxMat);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;

                        const posX = pallet.posX + box.x + box.placedL/2 - pallet.length/2;
                        const posY = box.y + box.h/2;
                        const posZ = pallet.posZ + box.z + box.placedW/2 - pallet.width/2;

                        mesh.position.set(posX, posY, posZ);
                        mesh.userData = { ...box, stepIndex: stepIdx + 1 };

                        const edgeGeo = new THREE.EdgesGeometry(boxGeo);
                        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });
                        mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

                        this.scene.add(mesh);
                        this.boxMeshes.push(mesh);
                    });
                });

                this.renderPalletListUI();

                if (this.selectedPalletId) {
                    const activePallet = this.pallets.find(p => p.id === this.selectedPalletId);
                    if (activePallet && activePallet.packedBoxes) {
                        document.getElementById('step-slider').max = activePallet.packedBoxes.length;
                        this.setStep(activePallet.packedBoxes.length);
                    }
                }

                this.saveLocalData();
            }

            createPalletBase3D(pallet) {
                const group = new THREE.Group();
                group.userData = { palletId: pallet.id };

                const woodMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.8 });
                const slatCount = 7;
                const slatWidth = pallet.length / slatCount - 8;

                for (let i = 0; i < slatCount; i++) {
                    const slatGeo = new THREE.BoxGeometry(slatWidth, 20, pallet.width);
                    const slat = new THREE.Mesh(slatGeo, woodMat);
                    slat.position.set(-pallet.length/2 + slatWidth/2 + i * (slatWidth + 8), -10, 0);
                    slat.receiveShadow = true;
                    slat.userData = { palletId: pallet.id };
                    group.add(slat);
                }

                group.position.set(pallet.posX, 0, pallet.posZ);
                this.palletMeshes.push(group);
                return group;
            }

            renderPalletListUI() {
                const container = document.getElementById('pallet-list-container');
                container.innerHTML = this.pallets.map(p => `
                    <div class="bg-slate-950 border ${this.selectedPalletId === p.id ? 'border-sky-500 ring-1 ring-sky-500' : 'border-slate-800'} rounded-xl p-2.5 space-y-2">
                        <div class="flex items-center justify-between">
                            <input type="text" value="${p.name}" onchange="app.renamePallet('${p.id}', this.value)" class="w-full bg-transparent border-b border-slate-700 text-xs font-bold text-white focus:border-sky-500 outline-none mr-2">
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="app.selectAndInspectPallet('${p.id}')" class="text-[11px] bg-sky-600 text-white px-2 py-1 rounded-lg flex items-center gap-1 active:scale-95">
                                    <i class="fa-solid fa-magnifying-glass"></i> ส่อง
                                </button>
                                <button onclick="app.deletePallet('${p.id}')" class="text-slate-500 hover:text-rose-400 p-1 text-xs">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-[10px] font-mono text-slate-400 bg-slate-900 p-1.5 rounded-lg">
                            <div>จัดวางได้: <span class="text-sky-400 font-bold">${p.packedBoxes ? p.packedBoxes.length : 0} ใบ</span></div>
                            <div>ความสูง: <span class="text-slate-300">${p.height} mm</span></div>
                        </div>
                    </div>
                `).join('');
            }

            renamePallet(palletId, newName) {
                const p = this.pallets.find(item => item.id === palletId);
                if (p) p.name = newName;
                this.recalculateAll();
            }

            setStep(step) {
                if (!this.selectedPalletId) return;
                this.currentStep = step;
                document.getElementById('step-slider').value = step;
                
                const activePallet = this.pallets.find(p => p.id === this.selectedPalletId);
                if (!activePallet || !activePallet.packedBoxes) return;

                document.getElementById('step-counter').textContent = `Step ${step} / ${activePallet.packedBoxes.length}`;

                this.boxMeshes.forEach(mesh => {
                    if (mesh.userData.palletId === this.selectedPalletId) {
                        mesh.visible = mesh.userData.stepIndex <= step;
                    }
                });
            }

            nextStep() { this.setStep(this.currentStep + 1); }
            prevStep() { if (this.currentStep > 0) this.setStep(this.currentStep - 1); }

            switchMobileTab(targetTab) {
                this.activeTab = targetTab;
                const view3d = document.getElementById('view-3d');
                const panelContent = document.getElementById('panel-content');

                ['3d', 'pallets', 'inspector', 'settings'].forEach(t => {
                    const btn = document.getElementById(`nav-btn-${t}`);
                    if (btn) {
                        btn.classList.remove('text-sky-400');
                        btn.classList.add('text-slate-400');
                    }
                });

                document.getElementById(`nav-btn-${targetTab}`).classList.add('text-sky-400');
                document.getElementById(`nav-btn-${targetTab}`).classList.remove('text-slate-400');

                if (targetTab === '3d') {
                    view3d.classList.remove('hidden');
                    panelContent.classList.add('hidden');
                } else {
                    view3d.classList.add('hidden');
                    panelContent.classList.remove('hidden');

                    ['pallets', 'inspector', 'settings'].forEach(t => {
                        const tabEl = document.getElementById(`tab-${t}`);
                        if (tabEl) tabEl.classList.add('hidden');
                    });
                    
                    if (targetTab === 'pallets') document.getElementById('tab-pallets').classList.remove('hidden');
                    if (targetTab === 'inspector') document.getElementById('tab-inspector').classList.remove('hidden');
                    if (targetTab === 'settings') document.getElementById('tab-settings').classList.remove('hidden');
                }
            }

            exportManifest() {
                const modal = document.getElementById('manifest-modal');
                const content = document.getElementById('manifest-content');

                content.innerHTML = `
                    <div class="border-b border-slate-800 pb-2">
                        <h3 class="text-xs font-bold text-white">รายงานสรุปการวางลัง 4 แถวแนวตั้ง</h3>
                    </div>

                    ${this.pallets.map((p, idx) => `
                        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-1">
                                <h4 class="font-bold text-sky-400 text-xs">${idx + 1}.${p.name}</h4>
                                <span class="font-mono text-[10px] text-slate-400">${p.packedBoxes ? p.packedBoxes.length : 0} กล่อง</span>
                            </div>
                            <table class="w-full text-left font-mono text-[10px]">
                                <thead>
                                    <tr class="text-slate-500 border-b border-slate-800">
                                        <th class="py-1">รหัส</th>
                                        <th class="py-1">ชื่อลัง</th>
                                        <th class="py-1">แถว/ชั้น</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(p.packedBoxes || []).map(b => `
                                        <tr class="border-b border-slate-900">
                                            <td class="py-1 text-sky-300 font-bold">${b.uid}</td>
                                            <td class="py-1 text-slate-200">${b.name}</td>
                                            <td class="py-1 text-amber-400">แถว ${b.columnNum || 1} (ชั้น ${b.layer})</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `).join('')}
                `;

                modal.classList.remove('hidden');
            }

            closeManifestModal() {
                document.getElementById('manifest-modal').classList.add('hidden');
            }
        }

        let app = null;
        window.addEventListener('load', () => { app = new FullSystemPalletApp(); });
    </script>
</body>
</html>
