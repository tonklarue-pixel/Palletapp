<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Pallet Studio Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Kanit', 'sans-serif'] } } }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #020617; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #canvas-container canvas { display: block; outline: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        button, input, select { touch-action: manipulation; }
    </style>
</head>
<body class="flex flex-col font-sans bg-slate-950 text-slate-100">

    <!-- Top Compact Header -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="bg-sky-600 p-1.5 rounded-lg text-white shadow">
                <i class="fa-solid fa-boxes-packing text-sm"></i>
            </div>
            <h1 class="font-bold text-sm text-white">Pallet3D <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.2 rounded-full">FIXED 3D</span></h1>
        </div>

        <div class="flex items-center space-x-1.5">
            <button id="btn-back-overview" onclick="app.viewAllOverview()" class="hidden bg-slate-800 text-sky-400 px-2 py-1 rounded-lg text-xs font-medium">
                <i class="fa-solid fa-globe"></i> ภาพรวม
            </button>
            <button onclick="app.addNewPallet()" class="bg-sky-600 text-white px-2.5 py-1 rounded-lg text-xs font-medium shadow">
                <i class="fa-solid fa-plus"></i> เพิ่มพาเลท
            </button>
        </div>
    </header>

    <!-- Main Body Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden" style="height: calc(100vh - 104px);">
        <!-- 3D Viewport -->
        <main id="view-3d" class="w-full h-full relative bg-slate-950">
            <div id="canvas-container"></div>

            <div class="absolute top-2 left-2 right-2 pointer-events-none z-10 flex justify-center">
                <div class="bg-slate-900/90 border border-slate-800 px-3 py-1 rounded-full text-[11px] text-slate-300 shadow">
                    <span id="view-mode-indicator" class="font-bold text-sky-400">ภาพรวมพาเลท (หมุน/ซูมได้)</span>
                </div>
            </div>
        </main>

        <!-- Control Sheet Panel -->
        <div id="panel-content" class="hidden w-full h-full bg-slate-900 overflow-y-auto custom-scrollbar p-3 space-y-3">
            <div id="tab-pallets" class="space-y-3">
                <div id="pallet-list-container" class="space-y-2"></div>
            </div>

            <div id="tab-inspector" class="hidden space-y-3">
                <div class="p-2.5 bg-sky-950/50 border border-sky-800/60 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-sky-300" id="insp-pallet-title">พาเลท</span>
                        <span id="insp-pallet-status" class="text-[10px] bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded-full">0 กล่อง</span>
                    </div>
                    <div class="grid grid-cols-3 gap-1.5 text-[11px]">
                        <div>
                            <label class="text-[10px] text-slate-400">ยาว (mm)</label>
                            <input type="number" id="active-pallet-l" onchange="app.updateActivePalletSpec()" class="w-full bg-slate-800 rounded px-1.5 py-1 text-sky-400">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">กว้าง (mm)</label>
                            <input type="number" id="active-pallet-w" onchange="app.updateActivePalletSpec()" class="w-full bg-slate-800 rounded px-1.5 py-1 text-sky-400">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400">สูง (mm)</label>
                            <input type="number" id="active-pallet-h" onchange="app.updateActivePalletSpec()" class="w-full bg-slate-800 rounded px-1.5 py-1 text-sky-400">
                        </div>
                    </div>
                </div>

                <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                    <div class="text-xs font-bold text-slate-200">เพิ่มลังแฟ้มลงพาเลทนี้</div>
                    <input type="text" id="new-box-name" placeholder="ชื่อลัง เช่น เอกสารการเงิน" class="w-full bg-slate-800 rounded px-2.5 py-1.5 text-xs text-white">
                    <div class="grid grid-cols-3 gap-1.5">
                        <input type="number" id="new-box-l" value="400" placeholder="ยาว" class="bg-slate-800 rounded px-1.5 py-1 text-xs">
                        <input type="number" id="new-box-w" value="300" placeholder="กว้าง" class="bg-slate-800 rounded px-1.5 py-1 text-xs">
                        <input type="number" id="new-box-h" value="250" placeholder="สูง" class="bg-slate-800 rounded px-1.5 py-1 text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <input type="number" id="new-box-qty" value="8" placeholder="จำนวน" class="bg-slate-800 rounded px-1.5 py-1 text-xs">
                        <input type="color" id="new-box-color" value="#0284c7" class="w-full h-7 bg-slate-800 rounded cursor-pointer p-0.5">
                    </div>
                    <button onclick="app.addBoxToActivePallet()" class="w-full bg-sky-600 text-white py-2 rounded-lg text-xs font-bold">+ เพิ่มกล่อง</button>
                </div>

                <div id="active-pallet-box-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="h-14 bg-slate-900 border-t border-slate-800 grid grid-cols-3 shrink-0 z-30">
        <button onclick="app.switchMobileTab('3d')" id="nav-btn-3d" class="flex flex-col items-center justify-center text-sky-400">
            <i class="fa-solid fa-cube text-base"></i>
            <span class="text-[10px] mt-0.5">ฉาก 3D</span>
        </button>
        <button onclick="app.switchMobileTab('pallets')" id="nav-btn-pallets" class="flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-pallet text-base"></i>
            <span class="text-[10px] mt-0.5">พาเลท</span>
        </button>
        <button onclick="app.switchMobileTab('inspector')" id="nav-btn-inspector" class="flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-box text-base"></i>
            <span class="text-[10px] mt-0.5">จัดการกล่อง</span>
        </button>
    </nav>

    <script>
        class FixedPalletApp {
            constructor() {
                this.pallets = [];
                this.selectedPalletId = null;
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.palletMeshes = [];
                this.boxMeshes = [];
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();

                this.init3D();
                this.initEvents();
                this.loadData();
            }

            init3D() {
                const container = document.getElementById('canvas-container');
                const width = container.clientWidth || window.innerWidth;
                const height = container.clientHeight || (window.innerHeight - 104);

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x020617);

                this.camera = new THREE.PerspectiveCamera(45, width / height, 1, 10000);
                this.camera.position.set(2000, 2500, 3000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;

                const ambient = new THREE.AmbientLight(0xffffff, 0.9);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(1000, 3000, 1000);
                this.scene.add(dirLight);

                const grid = new THREE.GridHelper(8000, 30, 0x334155, 0x1e293b);
                grid.position.y = -5;
                this.scene.add(grid);

                const animate = () => {
                    requestAnimationFrame(animate);
                    this.controls.update();
                    this.renderer.render(this.scene, this.camera);
                };
                animate();

                window.addEventListener('resize', () => {
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || (window.innerHeight - 104);
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                });
            }

            initEvents() {
                const container = document.getElementById('canvas-container');
                container.addEventListener('click', (e) => {
                    const rect = container.getBoundingClientRect();
                    this.mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                    this.mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const hits = this.raycaster.intersectObjects(this.palletMeshes, true);
                    if (hits.length > 0) {
                        let obj = hits[0].object;
                        while (obj.parent && !obj.userData.palletId) obj = obj.parent;
                        if (obj.userData.palletId) {
                            this.selectPallet(obj.userData.palletId);
                        }
                    }
                });
            }

            loadData() {
                const saved = localStorage.getItem('pallet_data_v4');
                if (saved) {
                    try { this.pallets = JSON.parse(saved); } catch(e) {}
                }
                if (!this.pallets || this.pallets.length === 0) {
                    this.pallets = [{
                        id: 'p-1', name: 'พาเลทที่ 1',
                        length: 1200, width: 1000, height: 1500,
                        posX: 0, posZ: 0,
                        boxes: [{ id: 'b-1', name: 'ลังแฟ้มเอกสาร', l: 400, w: 300, h: 250, qty: 8, color: '#0284c7' }]
                    }];
                }
                this.recalculateAll();
                this.viewAllOverview();
            }

            saveData() {
                localStorage.setItem('pallet_data_v4', JSON.stringify(this.pallets));
            }

            addNewPallet() {
                const id = 'p-' + Date.now();
                this.pallets.push({
                    id, name: `พาเลทที่ ${this.pallets.length + 1}`,
                    length: 1200, width: 1000, height: 1500,
                    posX: (this.pallets.length) * 1400, posZ: 0,
                    boxes: [{ id: 'b-1', name: 'ลังแฟ้มเอกสาร', l: 400, w: 300, h: 250, qty: 8, color: '#f59e0b' }]
                });
                this.recalculateAll();
                this.selectPallet(id);
            }

            selectPallet(id) {
                this.selectedPalletId = id;
                const p = this.pallets.find(x => x.id === id);
                if (!p) return;
                document.getElementById('btn-back-overview').classList.remove('hidden');
                document.getElementById('view-mode-indicator').textContent = `กำลังจัดการ: ${p.name}`;
                this.updateInspectorUI(p);
                this.switchMobileTab('inspector');
            }

            viewAllOverview() {
                this.selectedPalletId = null;
                document.getElementById('btn-back-overview').classList.add('hidden');
                document.getElementById('view-mode-indicator').textContent = 'ภาพรวมพาเลท (หมุน/ซูมได้)';
                this.camera.position.set(2000, 2500, 3000);
                this.controls.target.set(0, 0, 0);
                this.switchMobileTab('3d');
            }

            updateInspectorUI(p) {
                document.getElementById('insp-pallet-title').textContent = p.name;
                let total = 0; p.boxes.forEach(b => total += b.qty);
                document.getElementById
