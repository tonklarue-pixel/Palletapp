<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Pallet Studio Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        #canvas-container canvas { outline: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        button, input, select { touch-action: manipulation; }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 overflow-hidden">

    <!-- Top Compact Header -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="bg-sky-600 p-1.5 rounded-lg text-white shadow-md shadow-sky-600/30">
                <i class="fa-solid fa-boxes-packing text-sm"></i>
            </div>
            <h1 class="font-bold text-sm text-white flex items-center gap-1">
                Pallet3D <span class="text-[9px] bg-sky-500/20 text-sky-400 border border-sky-500/30 px-1.5 py-0.2 rounded-full font-mono">FIXED</span>
            </h1>
        </div>

        <div class="flex items-center space-x-1.5">
            <button id="btn-back-overview" onclick="app.viewAllOverview()" class="hidden bg-slate-800 text-sky-400 border border-sky-500/40 px-2 py-1 rounded-lg text-xs font-medium flex items-center gap-1 active:scale-95 transition-all">
                <i class="fa-solid fa-globe"></i> ภาพรวม
            </button>
            <button onclick="app.addNewPallet()" class="bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1 rounded-lg text-xs font-medium flex items-center gap-1 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-plus"></i> เพิ่มพาเลท
            </button>
            <button onclick="app.exportManifest()" class="bg-emerald-600 text-white p-1.5 rounded-lg text-xs active:scale-95 transition-all">
                <i class="fa-solid fa-file-invoice"></i>
            </button>
        </div>
    </header>

    <!-- Main Body Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden">

        <!-- 3D Viewport -->
        <main id="view-3d" class="flex-1 relative bg-slate-950 w-full h-full">
            <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

            <!-- Top Viewport Banner -->
            <div class="absolute top-2 left-2 right-2 pointer-events-none z-10 flex justify-center">
                <div class="bg-slate-900/85 backdrop-blur border border-slate-800 px-3 py-1 rounded-full text-[11px] text-slate-300 pointer-events-auto shadow-lg">
                    <span id="view-mode-indicator" class="font-bold text-sky-400 truncate">
                        <i class="fa-solid fa-eye"></i> ภาพรวมพาเลท (แตะพาเลทเพื่อส่องดู)
                    </span>
                </div>
            </div>

            <!-- Step Animation Overlay -->
            <div id="step-controller-bar" class="hidden absolute bottom-3 left-3 right-3 bg-slate-900/90 backdrop-blur border border-slate-800 p-2 rounded-xl shadow-xl z-10 flex flex-col gap-1">
                <div class="flex items-center justify-between text-[11px] text-slate-300 px-1">
                    <span class="font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-play-circle text-sky-400"></i> ขั้นตอนการวางซ้อน
                    </span>
                    <span id="step-counter" class="font-mono text-sky-400 font-bold">Step 0 / 0</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="app.prevStep()" class="p-1.5 bg-slate-800 rounded text-xs active:bg-slate-700"><i class="fa-solid fa-backward-step"></i></button>
                    <input type="range" id
