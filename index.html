<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Pallet Studio Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Kanit', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        #canvas-container canvas { outline: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        button, input, select { touch-action: manipulation; }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 overflow-hidden">

    <!-- Top Compact Header -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="bg-sky-600 p-1.5 rounded-lg text-white shadow">
                <i class="fa-solid fa-boxes-packing text-sm"></i>
            </div>
            <h1 class="font-bold text-sm text-white">Pallet3D <span class="text-[9px] bg-sky-500/20 text-sky-400 px-1.5 py-0.2 rounded-full">STANDARD</span></h1>
        </div>

        <div class="flex items-center space-x-1.5">
            <button id="btn-back-overview" onclick="app.viewAllOverview()" class="hidden bg-slate-800 text-sky-400 px-2 py-1 rounded-lg text-xs font-medium">
                <i class="fa-solid fa-globe"></i> ภาพรวม
            </button>
            <button onclick="app.addNewPallet()" class="bg-sky-600 text-white px-2.5 py-1 rounded-lg text-xs font-medium shadow">
                <i class="fa-solid fa-plus"></i> เพิ่มพาเลท
            </button>
        </div>
    </header>

    <!-- Main Body Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden">
        <!-- 3D Viewport -->
        <main id="view-3d" class="flex-1 relative bg-slate-950 w-full h-full">
            <div id="canvas-container" class="w-full h-full"></div>

            <div class="absolute top-2 left-2 right-2 pointer-events-none z-10 flex justify-center">
                <div class="bg-slate-900/90 border border-slate-800 px-3 py-1 rounded-full text-[11px] text-slate-300 shadow">
                    <span id="view-mode-indicator" class="font-bold text-sky-400">ภาพรวมพาเลท (แตะพาเลทเพื่อส่อง)</span>
                </div>
            </div>
        </main>

        <!-- Control Sheet Panel -->
        <div id="panel-content" class="hidden flex-1 bg-slate-900 overflow-y-auto custom-scrollbar p-3 space-y-3">
            <div id="tab-pallets" class="space-y-3">
                <div id="pallet-list-container" class="space-y-2"></div>
            </div>

            <div id="tab-inspector" class="hidden space-y-3">
                <div class="p-2.5 bg-sky-950/50 border border-sky-800/60 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-sky-300" id="insp-pallet-title">พาเลท</span>
                        <span id="insp-pallet-status" class="text-[10px] bg-
