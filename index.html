<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pallet Studio (Original Stable)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <!-- Top Floating Bar -->
    <div class="absolute top-3 left-3 right-3 flex justify-between items-center z-10 pointer-events-none">
        <div class="bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-xl shadow-lg pointer-events-auto flex items-center gap-2">
            <i class="fa-solid fa-cube text-sky-400"></i>
            <span class="font-bold text-xs text-white">Pallet3D Studio</span>
        </div>
        <button onclick="app.addNewPallet()" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-lg pointer-events-auto flex items-center gap-1 active:scale-95 transition-all">
            <i class="fa-solid fa-plus"></i> เพิ่มพาเลท
        </button>
    </div>

    <!-- 3D Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- Bottom Controls / Pallet List Sheet -->
    <div class="absolute bottom-3 left-3 right-3 bg-slate-900/95 border border-slate-800 p-3 rounded-2xl shadow-2xl backdrop-blur z-10 max-h-[40vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-pallet text-sky-400"></i> รายการพาเลททั้งหมด</span>
            <span id="total-pallets" class="text-[10px] bg-sky-500/20 text-sky-400 px-2 py-0.5 rounded-full font-mono">0 พาเลท</span>
        </div>
        <div id="pallet-list" class="space-y-2"></div>
    </div>

    <script>
        class OriginalPalletApp {
            constructor() {
                this.pallets = [];
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.palletMeshes = [];
                this.boxMeshes = [];

                this.init3D();
                this.loadDefaultData();
            }

            init3D() {
                const container = document.getElementById('canvas-container');

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x020617);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
                this.camera.position.set(2000, 2500, 3000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;

                // Lights
                const ambient = new THREE.AmbientLight(0xffffff, 0.8);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(1000, 3000, 1000);
                this.scene.add(dirLight);

                // Grid
                const grid = new THREE.GridHelper(10000, 40, 0x334155, 0x1e293b);
                grid.position.y = -5;
                this.scene.add(grid);

                const animate = () => {
                    requestAnimationFrame(animate);
                    this.controls.update();
                    this.renderer.render(this.scene, this.camera);
                };
                animate();

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            loadDefaultData() {
                const saved = localStorage.getItem('original_pallet_data');
                if (saved) {
                    try { this.pallets = JSON.parse(saved); } catch(e) {}
                }
                if (!this.pallets || this.pallets.length === 0) {
                    this.pallets = [{
                        id: 'p-1', name: 'พาเลทที่ 1',
                        length: 1200, width: 1000, height: 1500,
                        posX: 0, posZ: 0,
                        boxes: [{ name: 'ลังแฟ้ม', l: 400, w: 300, h: 250, qty: 8, color: '#0284c7' }]
                    }];
                }
                this.recalculateAll();
            }

            saveData() {
                localStorage.setItem('original_pallet_data', JSON.stringify(this.pallets));
            }

            addNewPallet() {
                const id = 'p-' + Date.now();
                this.pallets.push({
                    id, name: `พาเลทที่ ${this.pallets.length + 1}`,
                    length: 1200, width: 1000, height: 1500,
                    posX: (this.pallets.length - 0.5) * 1400, posZ: 0,
                    boxes: [{ name: 'ลังแฟ้ม', l: 400, w: 300, h: 250, qty: 8, color: '#f59e0b' }]
                });
                this.recalculateAll();
            }

            recalculateAll() {
                this.boxMeshes.forEach(m => this.scene.remove(m));
                this.palletMeshes.forEach(m => this.scene.remove(m));
                this.boxMeshes = [];
                this.palletMeshes = [];

                this.pallets.forEach(p => {
                    // Pallet Base
                    const woodMat = new THREE.MeshStandardMaterial({ color: 0x854d0e });
                    const baseGeo = new THREE.BoxGeometry(p.length, 20, p.width);
                    const baseMesh = new THREE.Mesh(baseGeo, woodMat);
                    baseMesh.position.set(p.posX, -10, p.posZ);
                    this.scene.add(baseMesh);
                    this.palletMeshes.push(baseMesh);

                    // 4-Column Grid Stacking
                    let items = [];
                    p.boxes.forEach(b => {
                        for (let i = 0; i < b.qty; i++) items.push(b);
                    });

                    const gridCols = 2, gridRows = 2;
                    const colW = p.length / gridCols;
                    const rowD = p.width / gridRows;
                    let heights = [0, 0, 0, 0];

                    items.forEach((item, idx) => {
                        const slot = idx % 4;
                        if (heights[slot] + item.h <= p.height) {
                            const c = slot % gridCols;
                            const r = Math.floor(slot / gridCols);
                            const x = c * colW + (colW - item.l) / 2;
                            const z = r * rowD + (rowD - item.w) / 2;

                            const boxGeo = new THREE.BoxGeometry(item.l, item.h, item.w);
                            const boxMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(item.color) });
                            const boxMesh = new THREE.Mesh(boxGeo, boxMat);

                            const worldX = p.posX + x + item.l/2 - p.length/2;
                            const worldY = heights[slot] + item.h/2;
                            const worldZ = p.posZ + z + item.w/2 - p.width/2;

                            boxMesh.position.set(worldX, worldY, worldZ);

                            // Edges
                            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0x000000 }));
                            boxMesh.add(edges);

                            this.scene.add(boxMesh);
                            this.boxMeshes.push(boxMesh);

                            heights[slot] += item.h;
                        }
                    });
                });

                this.renderListUI();
                this.saveData();
            }

            renderListUI() {
                document.getElementById('total-pallets').textContent = `${this.pallets.length} พาเลท`;
                const list = document.getElementById('pallet-list');
                list.innerHTML = this.pallets.map(p => `
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-sky-400">${p.name}</span>
                            <span class="text-slate-400 text-[10px] ml-2">(${p.boxes.reduce((a,b)=>a+b.qty,0)} กล่อง)</span>
                        </div>
                        <button onclick="app.removePallet('${p.id}')" class="text-rose-400 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }

            removePallet(id) {
                if (this.pallets.length <= 1) {
                    alert('ต้องมีอย่างน้อย 1 พาเลท');
                    return;
                }
                this.pallets = this.pallets.filter(p => p.id !== id);
                this.recalculateAll();
            }
        }

        let app = null;
        window.addEventListener('load', () => { app = new OriginalPalletApp(); });
    </script>
</body>
</html>
